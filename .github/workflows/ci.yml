name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Typecheck, tests, smoke test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  capture-addons:
    name: mitmproxy addon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "mitmproxy==12.3.1"
      - run: python test/python/test_token_capture.py
      - run: python test/python/test_bevel_capture.py
